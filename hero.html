<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Picsel — glitch hero</title>

  <!-- ===================================================================== -->
  <!--  ADOBE FONTS — web project ior4aly                                    -->
  <!-- ===================================================================== -->
  <!--
    Serves four families, and these are the exact CSS names (Adobe's names are
    lowercase-hyphenated, not the marketing names). They must match
    FONTS.PRIMARY / FONTS.ROTATION in hero.js:

        argent-pixel-cf        400 roman + 400 italic   <- the resting wordmark
        gridlite-pe-variable   variable 1..900
        pf-pixelscript         400
        pixelify-sans          400 + 700

    Note there is no 700 weight of argent-pixel-cf. hero.css therefore sets the
    wordmark to 400: asking for 700 makes the browser synthesise a fake bold,
    which on a pixel face smears the pixel grid and looks broken.

    To change the set: fonts.adobe.com -> the FONT's family page -> "</>" (Add
    to Web Project) -> pick this project. There is no "create project" button on
    the Web Projects page itself; new projects are only made from a font. Then
    re-read the family names from https://use.typekit.net/ior4aly.css and update
    hero.js. Names that don't resolve are dropped from the rotation
    automatically rather than flashing a fallback, so a typo shows up as "that
    font never appears" plus a console warning, not as a broken page.

    Licensing (your call, not code): Adobe serves these only while the Creative
    Cloud subscription is live, and Adobe's terms say a web project shouldn't be
    shared across client accounts. Fine for Picsel's own site; a client site
    needs the font on the client's own subscription, or a separately licensed
    self-hostable copy.
  -->
  <link rel="stylesheet" href="https://use.typekit.net/ior4aly.css" />

  <!-- Pixelify Sans from Google Fonts. The Adobe project now serves its own
       copy as "pixelify-sans", so this is redundant for the glitch rotation —
       it's kept as the licence-independent safety net: it is the FALLBACK
       resting font in hero.js, so if the Creative Cloud subscription lapses or
       Typekit is unreachable the wordmark still renders as a pixel face rather
       than dropping to Courier. Different family name ("Pixelify Sans" vs
       "pixelify-sans"), so the two never collide. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Lexend for the "Design Studio" line — a proportional face, deliberately
       not a pixel one, so it sits under the pixel wordmark rather than
       competing with it. -->
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Lexend:wght@300;400&display=swap"
        rel="stylesheet" />

  <link rel="stylesheet" href="nav.css" />
  <link rel="stylesheet" href="hero.css" />
</head>
<body>
  <section class="hero" id="hero">
    <!-- Layer 0: dot-grid texture. A halftone of a flowing noise field, kept
         near-invisible. Behind the blobs by default; DOTGRID.LAYER in hero.js
         flips it to an overlay on top of everything. -->
    <canvas id="dotgrid" class="hero-dots" aria-hidden="true"></canvas>

    <!-- Layer 1: lava-lamp blobs. Paths, gradients and the goo filter are all
         generated by hero.js — see BLOBS in the config block. -->
    <svg id="blobs" class="hero-blobs" aria-hidden="true" preserveAspectRatio="none">
      <defs id="blob-defs"></defs>
      <g id="blob-group"></g>
    </svg>

    <!-- Layer 2: the wordmark. Real text: the container carries the accessible
         name and the per-letter spans are hidden, so a screen reader says
         "Picsel — Design Studio" rather than spelling it out. -->
    <div class="hero-mark" role="img" aria-label="Picsel — Design Studio">
      <h1 class="wordmark" id="wordmark" aria-hidden="true">PICSEL</h1>
      <p class="tagline" id="tagline" aria-hidden="true">Design Studio</p>
    </div>
  </section>

  <script src="hero.js"></script>
  <script src="nav.js"></script>
</body>
</html>
