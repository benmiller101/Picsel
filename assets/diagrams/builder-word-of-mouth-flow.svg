<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 924" role="img"
     aria-labelledby="womTitle womDesc" font-family="var(--font-body, 'Lexend', ui-sans-serif, system-ui, sans-serif)">
  <title id="womTitle">What happens after someone recommends your building firm</title>
  <desc id="womDesc">Flow diagram. Someone recommends you to a neighbour. The neighbour has your name and nothing else, and is about to let a stranger work on their house for four months, so they look you up. The path then splits. If they find a Facebook page last posted in 2023, or a directory profile showing them two other builders, the recommendation you earned starts competing with people who did nothing to earn it. If they find your own website with twenty finished extensions, real reviews and a firm trading since 1975, they ring you.</desc>

  <rect width="680" height="924" fill="var(--bg, #0a0a0a)"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line-strong, rgba(255,255,255,0.22))"/>
    </marker>
  </defs>

  <text x="20" y="54" fill="var(--ink, #ffffff)" font-size="32" font-weight="500">What word of mouth becomes</text>
  <text x="20" y="86" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">What happens after someone recommends you</text>

  <!-- Node A -->
  <rect x="20" y="120" width="640" height="90" rx="12" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="340" y="172" fill="var(--ink, #ffffff)" font-size="26" font-weight="600" text-anchor="middle">Someone recommends you to a neighbour</text>

  <line x1="340" y1="210" x2="340" y2="242" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Node B -->
  <rect x="20" y="246" width="640" height="170" rx="12" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="340" y="286" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="24" text-anchor="middle">
    <tspan x="340" dy="0">They have your name and nothing else,</tspan>
    <tspan x="340" dy="34">and they&#8217;re about to let a stranger work</tspan>
    <tspan x="340" dy="34">on their house for four months.</tspan>
    <tspan x="340" dy="34">So they look you up.</tspan>
  </text>

  <line x1="340" y1="416" x2="340" y2="448" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2" marker-end="url(#arw)"/>
  <text x="364" y="436" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Either</text>

  <!-- Branch 1: no site, or a stale one -->
  <rect x="20" y="452" width="640" height="200" rx="14" fill="none" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="44" y="492" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="24">
    <tspan x="44" dy="0">They find a Facebook page last posted</tspan>
    <tspan x="44" dy="30">in 2023, or a directory profile that</tspan>
    <tspan x="44" dy="30">shows them two other builders.</tspan>
  </text>
  <text x="44" y="626" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">
    <tspan x="44" dy="0">The recommendation you earned now</tspan>
    <tspan x="44" dy="30">competes with people who did not earn it.</tspan>
  </text>

  <line x1="340" y1="652" x2="340" y2="684" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2" marker-end="url(#arw)"/>
  <text x="364" y="672" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Or</text>

  <!-- Branch 2: their own site -->
  <rect x="20" y="684" width="640" height="200" rx="16" fill="var(--bg-raised, #131313)" stroke="var(--accent, #f7861f)" stroke-width="3"/>
  <text x="44" y="724" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="24">
    <tspan x="44" dy="0">They find your own site. Twenty finished</tspan>
    <tspan x="44" dy="30">extensions, real reviews, and a firm</tspan>
    <tspan x="44" dy="30">trading since 1975.</tspan>
  </text>
  <text x="44" y="838" fill="var(--accent, #f7861f)" font-size="28" font-weight="600">They ring you.</text>
</svg>