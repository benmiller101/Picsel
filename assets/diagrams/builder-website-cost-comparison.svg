<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"
     aria-labelledby="ccTitle ccDesc" font-family="var(--font-body, 'Lexend', ui-sans-serif, system-ui, sans-serif)">
  <title id="ccTitle">What a builder's website costs in the first year</title>
  <desc id="ccDesc">Range chart comparing the first year cost of four ways a building firm can get a website. A template you build yourself costs £180 to £360 plus your own time. A freelancer one off build costs £500 to £1,500. A small studio that builds the site and looks after it costs £180 to £1,750. An agency costs £3,000 to £10,000 or more, plus a retainer.</desc>

  <rect width="900" height="440" fill="var(--bg, #0a0a0a)"/>

  <text x="40" y="40" fill="var(--ink, #ffffff)" font-size="21" font-weight="500">What a builder&#8217;s website costs in the first year</text>
  <text x="40" y="66" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="14">Build fee plus twelve months of any monthly charge. Ranges, not averages.</text>

  <g stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="1">
    <line x1="250" y1="100" x2="250" y2="365"/>
    <line x1="397.5" y1="100" x2="397.5" y2="365"/>
    <line x1="545" y1="100" x2="545" y2="365"/>
    <line x1="692.5" y1="100" x2="692.5" y2="365"/>
    <line x1="840" y1="100" x2="840" y2="365"/>
  </g>

  <g fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="13" text-anchor="middle">
    <text x="250" y="388">£0</text>
    <text x="397.5" y="388">£1,000</text>
    <text x="545" y="388">£2,000</text>
    <text x="692.5" y="388">£3,000</text>
    <text x="840" y="388">£4,000</text>
  </g>

  <g fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="15" text-anchor="end">
    <text x="234" y="140">Template, built by you</text>
    <text x="234" y="205">Freelancer, one off</text>
    <text x="234" y="270" fill="var(--ink, #ffffff)" font-weight="500">Small studio, looked after</text>
    <text x="234" y="335">Agency</text>
  </g>

  <g fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="13" text-anchor="end">
    <text x="234" y="157">plus your weekend</text>
    <text x="234" y="352">plus a retainer</text>
  </g>

  <g>
    <rect x="276.6" y="128.5" width="26.6" height="13" rx="4" fill="var(--ink-faint, rgba(255,255,255,0.52))"/>
    <rect x="323.8" y="193.5" width="147.5" height="13" rx="4" fill="var(--ink-faint, rgba(255,255,255,0.52))"/>
    <rect x="276.6" y="258.5" width="231.5" height="13" rx="4" fill="var(--chart-accent, #f7861f)"/>
    <path d="M692.5 323.5 h130 l18 6.5 l-18 6.5 h-130 z" fill="var(--ink-faint, rgba(255,255,255,0.52))"/>
  </g>

  <g fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="14">
    <text x="313" y="140">£180 to £360</text>
    <text x="481" y="205">£500 to £1,500</text>
    <text x="518" y="270" fill="var(--ink, #ffffff)">£180 to £1,750</text>
    <text x="692.5" y="316">£3,000 to £10,000+</text>
  </g>

  <text x="860" y="424" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="12"
        text-anchor="end" letter-spacing="0.06em">picsel.co.uk</text>
</svg>
