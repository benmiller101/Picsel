<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 860" role="img"
     aria-labelledby="ccTitle ccDesc" font-family="var(--font-body, 'Lexend', ui-sans-serif, system-ui, sans-serif)">
  <title id="ccTitle">What a builder's website costs in the first year</title>
  <desc id="ccDesc">Four rows, each a route to a building firm's website, ranked by first year cost: build fee plus twelve months of any monthly charge, as a range rather than an average. A template you build yourself costs £180 to £360, plus your own weekend. A freelancer one off build costs £500 to £1,500. A small studio that builds the site and looks after it costs £180 to £1,750. An agency costs £3,000 to £10,000 or more, plus a retainer.</desc>

  <rect width="680" height="860" fill="var(--bg, #0a0a0a)"/>

  <text x="20" y="54" fill="var(--ink, #ffffff)" font-size="32" font-weight="500">What it costs, first year</text>
  <text x="20" y="86" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Build fee plus twelve months of any monthly charge</text>

  <!-- Row 1: template, built by you -->
  <rect x="20" y="130" width="640" height="150" rx="14" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="44" y="170" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="28" font-weight="500">Template, built by you</text>
  <text x="44" y="204" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="26" font-weight="600">£180 to £360</text>
  <rect x="70.6" y="220" width="26.6" height="14" rx="4" fill="var(--ink-faint, rgba(255,255,255,0.52))"/>
  <text x="44" y="268" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">plus your weekend</text>

  <!-- Row 2: freelancer, one off -->
  <rect x="20" y="300" width="640" height="150" rx="14" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="44" y="340" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="28" font-weight="500">Freelancer, one off</text>
  <text x="44" y="374" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="26" font-weight="600">£500 to £1,500</text>
  <rect x="118" y="390" width="148" height="14" rx="4" fill="var(--ink-faint, rgba(255,255,255,0.52))"/>

  <!-- Row 3: small studio, looked after (Picsel's own row) -->
  <rect x="20" y="470" width="640" height="150" rx="16" fill="var(--bg-raised, #131313)" stroke="var(--accent, #f7861f)" stroke-width="3"/>
  <text x="44" y="510" fill="var(--ink, #ffffff)" font-size="28" font-weight="600">Small studio, looked after</text>
  <text x="44" y="544" fill="var(--ink, #ffffff)" font-size="26" font-weight="600">£180 to £1,750</text>
  <rect x="70.6" y="560" width="232.4" height="14" rx="4" fill="var(--accent, #f7861f)"/>

  <!-- Row 4: agency -->
  <rect x="20" y="640" width="640" height="150" rx="14" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="44" y="680" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="28" font-weight="500">Agency</text>
  <text x="44" y="714" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="26" font-weight="600">£3,000 to £10,000+</text>
  <path d="M488 736 h118 l20 7 l-20 7 h-118 z" fill="var(--ink-faint, rgba(255,255,255,0.52))"/>
  <text x="44" y="778" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">plus a retainer</text>

  <text x="660" y="828" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24"
        text-anchor="end" letter-spacing="0.04em">picsel.co.uk</text>
</svg>