<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1010" role="img"
     aria-labelledby="gbpTitle gbpDesc" font-family="var(--font-body, 'Lexend', ui-sans-serif, system-ui, sans-serif)">
  <title id="gbpTitle">Four checks for a profile that is not showing up</title>
  <desc id="gbpDesc">A flow down four checks, in the order this guide argues for. One, is it verified. If not, verify it. If clear, continue. Two, is the category right. If not, fix the category. If clear, continue. Three, do the details match. If not, match every detail. If clear, continue. Four, is there an old duplicate. If so, merge it. If clear, continue. Having passed all four, the flow ends on the point the guide says nobody tells you: results move with distance, you will not rank twenty miles out the way you do at home, and no amount of work changes that.</desc>

  <rect width="680" height="1010" fill="var(--bg, #0a0a0a)"/>

  <text x="20" y="54" fill="var(--ink, #ffffff)" font-size="32" font-weight="500">Four checks, in order</text>
  <text x="20" y="86" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Each one only matters once the last one clears</text>

  <!-- Row 1 -->
  <rect x="20" y="130" width="280" height="70" rx="12" fill="var(--bg-raised, #131313)" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2"/>
  <text x="160" y="173" fill="var(--ink, #ffffff)" font-size="26" font-weight="500" text-anchor="middle">Verified?</text>

  <rect x="460" y="130" width="200" height="70" rx="10" fill="none" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="560" y="171" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" text-anchor="middle">Verify it</text>

  <!-- Row 2 -->
  <rect x="20" y="300" width="280" height="70" rx="12" fill="var(--bg-raised, #131313)" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2"/>
  <text x="160" y="343" fill="var(--ink, #ffffff)" font-size="26" font-weight="500" text-anchor="middle">Right category?</text>

  <rect x="460" y="300" width="200" height="70" rx="10" fill="none" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="560" y="330" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" text-anchor="middle">
    <tspan x="560" dy="0">Fix the</tspan>
    <tspan x="560" dy="28">category</tspan>
  </text>

  <!-- Row 3 -->
  <rect x="20" y="470" width="280" height="70" rx="12" fill="var(--bg-raised, #131313)" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2"/>
  <text x="160" y="513" fill="var(--ink, #ffffff)" font-size="26" font-weight="500" text-anchor="middle">Details match?</text>

  <rect x="460" y="470" width="200" height="70" rx="10" fill="none" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="560" y="500" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" text-anchor="middle">
    <tspan x="560" dy="0">Match every</tspan>
    <tspan x="560" dy="28">detail</tspan>
  </text>

  <!-- Row 4 -->
  <rect x="20" y="640" width="280" height="70" rx="12" fill="var(--bg-raised, #131313)" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2"/>
  <text x="160" y="683" fill="var(--ink, #ffffff)" font-size="26" font-weight="500" text-anchor="middle">Old duplicate?</text>

  <rect x="460" y="640" width="200" height="70" rx="10" fill="none" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="560" y="670" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" text-anchor="middle">
    <tspan x="560" dy="0">Merge the</tspan>
    <tspan x="560" dy="28">duplicate</tspan>
  </text>

  <!-- Horizontal connectors: gate to fix, one per row -->
  <g stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2">
    <line x1="300" y1="165" x2="456" y2="165"/>
    <line x1="300" y1="335" x2="456" y2="335"/>
    <line x1="300" y1="505" x2="456" y2="505"/>
    <line x1="300" y1="675" x2="456" y2="675"/>
  </g>
  <g fill="var(--line-strong, rgba(255,255,255,0.22))">
    <polygon points="460,165 450,159 450,171"/>
    <polygon points="460,335 450,329 450,341"/>
    <polygon points="460,505 450,499 450,511"/>
    <polygon points="460,675 450,669 450,681"/>
  </g>
  <g fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" text-anchor="middle">
    <text x="380" y="150">problem</text>
    <text x="380" y="320">problem</text>
    <text x="380" y="490">problem</text>
    <text x="380" y="660">problem</text>
  </g>

  <!-- Vertical connectors: gate to next gate, when clear -->
  <g stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2">
    <line x1="160" y1="200" x2="160" y2="296"/>
    <line x1="160" y1="370" x2="160" y2="466"/>
    <line x1="160" y1="540" x2="160" y2="636"/>
    <line x1="160" y1="710" x2="160" y2="816"/>
  </g>
  <g fill="var(--line-strong, rgba(255,255,255,0.22))">
    <polygon points="160,296 154,286 166,286"/>
    <polygon points="160,466 154,456 166,456"/>
    <polygon points="160,636 154,626 166,626"/>
    <polygon points="160,816 154,806 166,806"/>
  </g>
  <g fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">
    <text x="176" y="253">clear</text>
    <text x="176" y="423">clear</text>
    <text x="176" y="593">clear</text>
    <text x="176" y="768">clear</text>
  </g>

  <!-- The end point: the distance fact -->
  <rect x="20" y="820" width="640" height="170" rx="16" fill="var(--bg-raised, #131313)" stroke="var(--chart-accent, #f7861f)" stroke-width="3"/>
  <text x="44" y="858" fill="var(--chart-accent, #f7861f)" font-size="26" font-weight="500">Still not showing, all four checked?</text>
  <text x="44" y="896" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="24">
    <tspan x="44" dy="0">Results move with distance: you won’t</tspan>
    <tspan x="44" dy="32">rank twenty miles out like at home.</tspan>
    <tspan x="44" dy="32">No amount of work changes that.</tspan>
  </text>
</svg>
