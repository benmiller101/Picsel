<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" role="img"
     aria-labelledby="hmcTitle hmcDesc" font-family="var(--font-body, 'Lexend', ui-sans-serif, system-ui, sans-serif)">
  <title id="hmcTitle">What the price of a trades website actually buys</title>
  <desc id="hmcDesc">Three things bundled into one number. The build, which happens once. Running it, which is ongoing: hosting, the certificate, staying online. Getting found, which is ongoing or it is nothing. Below them, what a cheap quote usually misses: getting found, nearly always missing, and running it, sometimes missing too.</desc>

  <rect width="680" height="850" fill="var(--bg, #0a0a0a)"/>

  <text x="20" y="54" fill="var(--ink, #ffffff)" font-size="32" font-weight="500">What the price buys</text>
  <text x="20" y="86" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Three things bundled into one number</text>

  <!-- The build -->
  <rect x="20" y="120" width="640" height="150" rx="14" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="44" y="164" fill="var(--ink, #ffffff)" font-size="30" font-weight="600">The build</text>
  <text x="44" y="194" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" letter-spacing="0.08em">HAPPENS ONCE</text>

  <!-- Running it -->
  <rect x="20" y="294" width="640" height="150" rx="14" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="44" y="338" fill="var(--ink, #ffffff)" font-size="30" font-weight="600">Running it</text>
  <text x="44" y="368" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" letter-spacing="0.08em">ONGOING</text>
  <text x="44" y="404" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="24">Hosting, the certificate, staying online</text>

  <!-- Getting found -->
  <rect x="20" y="468" width="640" height="150" rx="14" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="44" y="512" fill="var(--ink, #ffffff)" font-size="30" font-weight="600">Getting found</text>
  <text x="44" y="542" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" letter-spacing="0.08em">ONGOING, OR NOTHING</text>

  <!-- What a cheap quote leaves out -->
  <rect x="20" y="642" width="640" height="180" rx="16" fill="var(--bg-raised, #131313)" stroke="var(--chart-accent, #f7861f)" stroke-width="3"/>
  <text x="44" y="680" fill="var(--chart-accent, #f7861f)" font-size="26" font-weight="500">What a cheap quote usually misses</text>
  <text x="44" y="720" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="24" text-decoration="line-through">Getting found, nearly always missing</text>
  <text x="44" y="754" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Running it, sometimes missing too</text>
</svg>
