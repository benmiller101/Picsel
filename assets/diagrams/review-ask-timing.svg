<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" role="img"
     aria-labelledby="revTitle revDesc" font-family="var(--font-body, 'Lexend', ui-sans-serif, system-ui, sans-serif)">
  <title id="revTitle">When to ask for a review, against the job's timeline</title>
  <desc id="revDesc">A vertical timeline in three stages. First, the job finishes, on site. Moments later comes the window: ask now, because they are happy and you are stood in front of them, phone in hand. A day later, if you have not asked, it is too late: they are back at work and the moment is gone.</desc>

  <rect width="680" height="660" fill="var(--bg, #0a0a0a)"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line-strong, rgba(255,255,255,0.22))"/>
    </marker>
  </defs>

  <text x="20" y="54" fill="var(--ink, #ffffff)" font-size="32" font-weight="500">When to ask</text>
  <text x="20" y="86" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">The moment matters more than the wording</text>

  <!-- Stage 1: the job finishes -->
  <rect x="20" y="120" width="640" height="110" rx="14" fill="var(--bg-raised, #131313)" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2"/>
  <text x="44" y="164" fill="var(--ink, #ffffff)" font-size="28" font-weight="600">The job finishes</text>
  <text x="44" y="196" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" letter-spacing="0.06em">ON SITE, JOB DONE</text>

  <!-- Arrow: moments later -->
  <line x1="160" y1="230" x2="160" y2="262" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2" marker-end="url(#arw)"/>
  <text x="188" y="252" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Moments later</text>

  <!-- Stage 2: the window, accented -->
  <rect x="20" y="266" width="640" height="200" rx="16" fill="var(--bg-raised, #131313)" stroke="var(--accent, #f7861f)" stroke-width="3"/>
  <text x="44" y="308" fill="var(--accent, #f7861f)" font-size="30" font-weight="600">Ask now</text>
  <text x="44" y="340" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24" letter-spacing="0.06em">THE WINDOW</text>
  <text x="44" y="378" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="24">
    <tspan x="44" dy="0">They&#8217;re happy, and you&#8217;re stood in front of them.</tspan>
    <tspan x="44" dy="34">Ask while your phone&#8217;s in your hand.</tspan>
  </text>

  <!-- Arrow: a day later -->
  <line x1="160" y1="466" x2="160" y2="498" stroke="var(--line-strong, rgba(255,255,255,0.22))" stroke-width="2" marker-end="url(#arw)"/>
  <text x="188" y="488" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">A day later</text>

  <!-- Stage 3: too late, faded and dashed -->
  <rect x="20" y="502" width="640" height="118" rx="14" fill="none" stroke="var(--line, rgba(255,255,255,0.12))" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="44" y="546" fill="var(--ink-muted, rgba(255,255,255,0.72))" font-size="28" font-weight="500">Too late</text>
  <text x="44" y="580" fill="var(--ink-faint, rgba(255,255,255,0.52))" font-size="24">Back at work. The moment&#8217;s gone.</text>
</svg>